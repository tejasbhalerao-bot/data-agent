<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 Roadmap — Logistics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: ui-rounded, ui-sans-serif, system-ui, -apple-system, sans-serif;

      --accent:       #F4873E;
      --accent-hover: #E07530;
      --accent-dim:   #FFF0E4;
      --accent-text:  #B85A18;

      --bg:        #FFF8F3;
      --surface:   #FFFFFF;
      --surface-2: #FFF2E8;
      --border:    rgba(244,135,62,0.14);
      --border-ui: rgba(180,120,80,0.18);

      --text-1: #2D2018;
      --text-2: #8B6E52;
      --text-3: #C4A882;

      --ok-bg:   #D4F4EE; --ok-fg:   #1A7A6E;
      --warn-bg: #FEF3C7; --warn-fg: #92400E;
      --err-bg:  #FEE2D5; --err-fg:  #9A2E10;

      --radius:    20px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow:    0 2px 12px rgba(180,100,40,0.08), 0 1px 3px rgba(180,100,40,0.05);
      --shadow-md: 0 8px 28px rgba(180,100,40,0.10), 0 2px 6px rgba(180,100,40,0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --accent:       #1261F5;
        --accent-hover: #0A52E0;
        --accent-dim:   rgba(18,97,245,0.14);
        --accent-text:  #6B9FFF;
        --bg:        #0B0B10;
        --surface:   #13131C;
        --surface-2: #1C1C28;
        --border:    rgba(255,255,255,0.07);
        --border-ui: rgba(255,255,255,0.13);
        --text-1: #FFFFFF;
        --text-2: #8C8CA8;
        --text-3: #48485E;
        --ok-bg:   rgba(0,196,154,0.12);  --ok-fg:   #00C49A;
        --warn-bg: rgba(255,149,0,0.12);  --warn-fg: #FF9500;
        --err-bg:  rgba(255,59,92,0.12);  --err-fg:  #FF3B5C;
        --radius:    12px;
        --radius-sm: 8px;
        --radius-xs: 6px;
        --shadow:    0 1px 4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
        --shadow-md: 0 4px 20px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
      }
    }

    :root[data-theme="light"] {
      --font: ui-rounded, ui-sans-serif, system-ui, -apple-system, sans-serif;
      --accent:       #F4873E;
      --accent-hover: #E07530;
      --accent-dim:   #FFF0E4;
      --accent-text:  #B85A18;
      --bg:        #FFF8F3;
      --surface:   #FFFFFF;
      --surface-2: #FFF2E8;
      --border:    rgba(244,135,62,0.14);
      --border-ui: rgba(180,120,80,0.18);
      --text-1: #2D2018;
      --text-2: #8B6E52;
      --text-3: #C4A882;
      --ok-bg:   #D4F4EE; --ok-fg:   #1A7A6E;
      --warn-bg: #FEF3C7; --warn-fg: #92400E;
      --err-bg:  #FEE2D5; --err-fg:  #9A2E10;
      --radius:    20px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow:    0 2px 12px rgba(180,100,40,0.08), 0 1px 3px rgba(180,100,40,0.05);
      --shadow-md: 0 8px 28px rgba(180,100,40,0.10), 0 2px 6px rgba(180,100,40,0.06);
    }

    :root[data-theme="dark"] {
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --accent:       #1261F5;
      --accent-hover: #0A52E0;
      --accent-dim:   rgba(18,97,245,0.14);
      --accent-text:  #6B9FFF;
      --bg:        #0B0B10;
      --surface:   #13131C;
      --surface-2: #1C1C28;
      --border:    rgba(255,255,255,0.07);
      --border-ui: rgba(255,255,255,0.13);
      --text-1: #FFFFFF;
      --text-2: #8C8CA8;
      --text-3: #48485E;
      --ok-bg:   rgba(0,196,154,0.12);  --ok-fg:   #00C49A;
      --warn-bg: rgba(255,149,0,0.12);  --warn-fg: #FF9500;
      --err-bg:  rgba(255,59,92,0.12);  --err-fg:  #FF3B5C;
      --radius:    12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow:    0 1px 4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    /* ── Header ── */
    .page-header {
      margin-bottom: 3rem;
    }

    .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 750;
      letter-spacing: -0.025em;
      line-height: 1.15;
      text-wrap: balance;
      color: var(--text-1);
    }
  </style>
</head>
<body>
<div class="page">

  <header class="page-header">
    <div class="eyebrow">Logistics · Q2 2026</div>
    <h1>Q2 Roadmap</h1>
  </header>

</div>
</body>
</html>
