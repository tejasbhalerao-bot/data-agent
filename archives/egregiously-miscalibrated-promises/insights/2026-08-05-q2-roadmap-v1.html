<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 Roadmap — Logistics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: ui-rounded, ui-sans-serif, system-ui, -apple-system, sans-serif;

      --accent:       #F4873E;
      --accent-hover: #E07530;
      --accent-dim:   #FFF0E4;
      --accent-text:  #B85A18;

      --bg:        #FFF8F3;
      --surface:   #FFFFFF;
      --surface-2: #FFF2E8;
      --border:    rgba(244,135,62,0.14);
      --border-ui: rgba(180,120,80,0.18);

      --text-1: #2D2018;
      --text-2: #8B6E52;
      --text-3: #C4A882;

      --ok-bg:   #D4F4EE; --ok-fg:   #1A7A6E;
      --warn-bg: #FEF3C7; --warn-fg: #92400E;
      --err-bg:  #FEE2D5; --err-fg:  #9A2E10;

      --radius:    20px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow:    0 2px 12px rgba(180,100,40,0.08), 0 1px 3px rgba(180,100,40,0.05);
      --shadow-md: 0 8px 28px rgba(180,100,40,0.10), 0 2px 6px rgba(180,100,40,0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --accent:       #1261F5;
        --accent-hover: #0A52E0;
        --accent-dim:   rgba(18,97,245,0.14);
        --accent-text:  #6B9FFF;
        --bg:        #0B0B10;
        --surface:   #13131C;
        --surface-2: #1C1C28;
        --border:    rgba(255,255,255,0.07);
        --border-ui: rgba(255,255,255,0.13);
        --text-1: #FFFFFF;
        --text-2: #8C8CA8;
        --text-3: #48485E;
        --ok-bg:   rgba(0,196,154,0.12);  --ok-fg:   #00C49A;
        --warn-bg: rgba(255,149,0,0.12);  --warn-fg: #FF9500;
        --err-bg:  rgba(255,59,92,0.12);  --err-fg:  #FF3B5C;
        --radius:    12px;
        --radius-sm: 8px;
        --radius-xs: 6px;
        --shadow:    0 1px 4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
        --shadow-md: 0 4px 20px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
      }
    }

    :root[data-theme="light"] {
      --font: ui-rounded, ui-sans-serif, system-ui, -apple-system, sans-serif;
      --accent:       #F4873E;
      --accent-hover: #E07530;
      --accent-dim:   #FFF0E4;
      --accent-text:  #B85A18;
      --bg:        #FFF8F3;
      --surface:   #FFFFFF;
      --surface-2: #FFF2E8;
      --border:    rgba(244,135,62,0.14);
      --border-ui: rgba(180,120,80,0.18);
      --text-1: #2D2018;
      --text-2: #8B6E52;
      --text-3: #C4A882;
      --ok-bg:   #D4F4EE; --ok-fg:   #1A7A6E;
      --warn-bg: #FEF3C7; --warn-fg: #92400E;
      --err-bg:  #FEE2D5; --err-fg:  #9A2E10;
      --radius:    20px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow:    0 2px 12px rgba(180,100,40,0.08), 0 1px 3px rgba(180,100,40,0.05);
      --shadow-md: 0 8px 28px rgba(180,100,40,0.10), 0 2px 6px rgba(180,100,40,0.06);
    }

    :root[data-theme="dark"] {
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --accent:       #1261F5;
      --accent-hover: #0A52E0;
      --accent-dim:   rgba(18,97,245,0.14);
      --accent-text:  #6B9FFF;
      --bg:        #0B0B10;
      --surface:   #13131C;
      --surface-2: #1C1C28;
      --border:    rgba(255,255,255,0.07);
      --border-ui: rgba(255,255,255,0.13);
      --text-1: #FFFFFF;
      --text-2: #8C8CA8;
      --text-3: #48485E;
      --ok-bg:   rgba(0,196,154,0.12);  --ok-fg:   #00C49A;
      --warn-bg: rgba(255,149,0,0.12);  --warn-fg: #FF9500;
      --err-bg:  rgba(255,59,92,0.12);  --err-fg:  #FF3B5C;
      --radius:    12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow:    0 1px 4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    .section {
      margin-top: 2.5rem;
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 1rem;
    }

    .growth-loop-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem;
    }

    /* ── Header ── */
    .page-header {
      margin-bottom: 3rem;
    }

    .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 750;
      letter-spacing: -0.025em;
      line-height: 1.15;
      text-wrap: balance;
      color: var(--text-1);
    }
  </style>
</head>
<body>
<div class="page">

  <header class="page-header">
    <div class="eyebrow">Logistics · Q2 2026</div>
    <h1>Q2 Roadmap</h1>
  </header>

  <!-- Growth Loop -->
  <section class="section">
    <div class="section-label">The Logistics Growth Loop</div>
    <div class="growth-loop-wrap">
      <svg viewBox="0 0 760 205" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
        <defs>
          <marker id="arr-up" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
            <path d="M0,8 L4,0 L8,8" fill="none" stroke="#C4A882" stroke-width="1.5" stroke-linejoin="round"/>
          </marker>
          <marker id="arr-right" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#C4A882" stroke-width="1.5" stroke-linejoin="round"/>
          </marker>
          <marker id="arr-down" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
            <path d="M0,0 L4,8 L8,0" fill="none" stroke="#C4A882" stroke-width="1.5" stroke-linejoin="round"/>
          </marker>
        </defs>

        <!-- Box 1: Better promises -->
        <rect x="15" y="18" width="130" height="62" rx="12" fill="#F4873E"/>
        <text x="80" y="43" text-anchor="middle" fill="#fff" font-weight="750" font-size="14.5" font-family="ui-rounded,sans-serif">Better</text>
        <text x="80" y="62" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-rounded,sans-serif">promises</text>

        <!-- Arrow 1→2 -->
        <line x1="146" y1="49" x2="170" y2="49" stroke="#C4A882" stroke-width="1.5" marker-end="url(#arr-right)"/>

        <!-- Box 2: Conversion gained -->
        <rect x="172" y="18" width="130" height="62" rx="12" fill="#F4873E"/>
        <text x="237" y="43" text-anchor="middle" fill="#fff" font-weight="750" font-size="14.5" font-family="ui-rounded,sans-serif">Conversion</text>
        <text x="237" y="62" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-rounded,sans-serif">gained</text>

        <!-- Arrow 2→3 -->
        <line x1="303" y1="49" x2="327" y2="49" stroke="#C4A882" stroke-width="1.5" marker-end="url(#arr-right)"/>

        <!-- Box 3: On-time delivery given -->
        <rect x="329" y="18" width="140" height="62" rx="12" fill="#F4873E"/>
        <text x="399" y="43" text-anchor="middle" fill="#fff" font-weight="750" font-size="14.5" font-family="ui-rounded,sans-serif">On-time</text>
        <text x="399" y="62" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-rounded,sans-serif">delivery given</text>

        <!-- Arrow 3→4 -->
        <line x1="470" y1="49" x2="494" y2="49" stroke="#C4A882" stroke-width="1.5" marker-end="url(#arr-right)"/>

        <!-- Box 4: Retention gain -->
        <rect x="496" y="18" width="130" height="62" rx="12" fill="#F4873E"/>
        <text x="561" y="43" text-anchor="middle" fill="#fff" font-weight="750" font-size="14.5" font-family="ui-rounded,sans-serif">Retention</text>
        <text x="561" y="62" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-rounded,sans-serif">gain</text>

        <!-- Arrow 4→Accurate (down) -->
        <line x1="615" y1="81" x2="615" y2="118" stroke="#C4A882" stroke-width="1.5" marker-end="url(#arr-down)"/>

        <!-- Box 5: Accurate promises -->
        <rect x="550" y="120" width="130" height="62" rx="12" fill="#1A7A6E"/>
        <text x="615" y="145" text-anchor="middle" fill="#fff" font-weight="750" font-size="14.5" font-family="ui-rounded,sans-serif">Accurate</text>
        <text x="615" y="164" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12" font-family="ui-rounded,sans-serif">promises</text>

        <!-- Feedback loop: left side of Accurate → bottom left → up to Better -->
        <path d="M550,151 L46,151 L46,82" stroke="#C4A882" stroke-width="1.5" fill="none" marker-end="url(#arr-up)"/>

        <!-- Feedback label -->
        <text x="295" y="170" text-anchor="middle" fill="#8B6E52" font-size="11.5" font-family="ui-rounded,sans-serif">↻  order density sharpens ETA accuracy</text>
      </svg>
    </div>
  </section>

</div>
</body>
</html>
