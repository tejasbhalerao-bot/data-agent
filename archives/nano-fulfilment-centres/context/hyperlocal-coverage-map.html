<head>
<meta charset="UTF-8">

<title>Hyperlocal Coverage — Truemeds</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --ink: #151a21;
    --paper: #f6f5f1;
    --panel: #ffffff;
    --line: #e4e1d8;
    --muted: #6b7280;
    --accent: #1d4ed8;
    --accent-soft: #dbeafe;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; background: var(--ink); color: #fff; flex-shrink: 0;
    gap: 16px; flex-wrap: wrap;
  }
  header .title h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .title span { font-size: 12px; color: #a9b0bb; }
  .stats { display: flex; gap: 28px; }
  .stat .num { font-size: 20px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 10.5px; color: #a9b0bb; text-transform: uppercase; letter-spacing: .06em; }

  #body { flex: 1; display: flex; min-height: 0; }

  #panel {
    width: 280px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); padding: 16px; overflow-y: auto;
  }
  #panel h2 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 18px 0 8px;
  }
  #panel h2:first-child { margin-top: 0; }

  .seg { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1; border: none; background: transparent; padding: 7px 4px; border-radius: 6px;
    font-size: 12.5px; cursor: pointer; color: var(--muted); font-weight: 600; transition: all .15s;
  }
  .seg button.active { background: var(--ink); color: #fff; }

  table.top { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.top th {
    text-align: left; font-weight: 600; color: var(--muted); font-size: 10.5px;
    text-transform: uppercase; padding: 4px; border-bottom: 1px solid var(--line);
  }
  table.top td { padding: 6px 4px; border-bottom: 1px solid #f0efe9; cursor: pointer; }
  table.top tr:hover td { background: var(--accent-soft); }
  table.top td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .legend {
    background: rgba(255,255,255,.95); padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 1px 8px rgba(0,0,0,.15); font-size: 11px; color: var(--ink); line-height: 1.8;
  }
  .legend strong { display: block; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
  .legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; border: 1px solid rgba(0,0,0,.15); }

  #map { flex: 1; }
  .leaflet-popup-content b { display: block; font-size: 13px; margin-bottom: 2px; }
  .leaflet-popup-content span { color: var(--muted); font-size: 12px; }

  .hover-info {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(21,26,33,.85); color: #fff; font-size: 12px;
    padding: 6px 14px; border-radius: 20px; pointer-events: none; z-index: 1000;
    white-space: nowrap; display: none;
  }
</style>
</head>

const CITIES=[{"city":"Kolkata","count":150,"lat":22.573,"lon":88.364},{"city":"Mumbai","count":110,"lat":19.076,"lon":72.878},{"city":"Chennai","count":105,"lat":13.083,"lon":80.271},{"city":"Bengaluru","count":100,"lat":12.972,"lon":77.595},{"city":"Hyderabad","count":79,"lat":17.385,"lon":78.487},{"city":"Delhi","count":76,"lat":28.644,"lon":77.216},{"city":"Ahmedabad","count":69,"lat":23.033,"lon":72.618},{"city":"Pune","count":61,"lat":18.52,"lon":73.857},{"city":"Kanpur","count":48,"lat":26.45,"lon":80.332},{"city":"Darbhanga","count":43,"lat":26.154,"lon":85.892},{"city":"Guwahati","count":38,"lat":26.145,"lon":91.736},{"city":"Nagpur","count":38,"lat":21.146,"lon":79.088},{"city":"Chandigarh","count":37,"lat":30.733,"lon":76.779},{"city":"Jaipur","count":35,"lat":26.912,"lon":75.787},{"city":"Lucknow","count":35,"lat":26.847,"lon":80.946},{"city":"Indore","count":33,"lat":22.72,"lon":75.858},{"city":"Bhubaneswar","count":31,"lat":20.296,"lon":85.825},{"city":"Patna","count":30,"lat":25.594,"lon":85.138},{"city":"Delhi / Ghaziabad","count":29,"lat":28.66,"lon":77.43},{"city":"Howrah","count":26,"lat":22.596,"lon":88.264},{"city":"Varanasi","count":26,"lat":25.318,"lon":82.974},{"city":"Gurugram","count":25,"lat":28.459,"lon":77.027},{"city":"Raipur","count":19,"lat":21.251,"lon":81.63},{"city":"Faridabad","count":15,"lat":28.409,"lon":77.318},{"city":"Noida","count":15,"lat":28.535,"lon":77.391},{"city":"Ranchi","count":11,"lat":23.344,"lon":85.31},{"city":"Thane","count":11,"lat":19.218,"lon":72.978},{"city":"Navi Mumbai","count":9,"lat":19.033,"lon":73.03}];

// Map init
const map = L.map('map', { zoomControl: true }).setView([22, 80], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// Polygon style
const STYLE = { color: '#1d4ed8', weight: 0.8, fillColor: '#3b82f6', fillOpacity: 0.35 };
const HOVER = { color: '#1d4ed8', weight: 1.5, fillColor: '#6366f1', fillOpacity: 0.6 };

let activeLayer = null;
const hoverEl = document.getElementById('hoverInfo');

const geoLayer = L.geoJSON(PINCODE_GEO, {
  style: () => ({ ...STYLE }),
  onEachFeature: (feature, layer) => {
    const p = feature.properties;
    layer.on({
      mouseover(e) {
        e.target.setStyle(HOVER);
        hoverEl.style.display = 'block';
        hoverEl.textContent = `${p.p} · ${p.d}, ${p.s}`;
      },
      mouseout(e) {
        geoLayer.resetStyle(e.target);
        hoverEl.style.display = 'none';
      },
      click(e) {
        map.fitBounds(e.target.getBounds(), { maxZoom: 13, padding: [40, 40] });
        L.popup()
          .setLatLng(e.latlng)
          .setContent(`<b>Pincode ${p.p}</b><span>${p.d}<br>${p.s}</span>`)
          .openOn(map);
      }
    });
  }
}).addTo(map);

// Bubble layer
const bubbleGroup = L.layerGroup();
const maxC = Math.max(...CITIES.map(c => c.count));
CITIES.forEach(c => {
  const r = 6 + Math.sqrt(c.count / maxC) * 28;
  L.circleMarker([c.lat, c.lon], {
    radius: r, color: '#1d4ed8', weight: 1.5,
    fillColor: '#3b82f6', fillOpacity: 0.55
  }).bindPopup(`<b>${c.city}</b><span>${c.count} pincodes served</span>`)
    .addTo(bubbleGroup);
});

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `<strong>Hyperlocal Coverage</strong>
    <span class="sw" style="background:#3b82f6;opacity:.4"></span> SDD / NDD served pincode`;
  return d;
};
legend.addTo(map);

// City table
const tbody = document.getElementById('cityTable');
CITIES.forEach(c => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${c.city}</td><td class="n">${c.count}</td>`;
  tr.addEventListener('click', () => map.setView([c.lat, c.lon], 11));
  tbody.appendChild(tr);
});

// Toggle
document.getElementById('modePolygons').addEventListener('click', () => {
  document.getElementById('modePolygons').classList.add('active');
  document.getElementById('modeBubbles').classList.remove('active');
  if (!map.hasLayer(geoLayer)) map.addLayer(geoLayer);
  if (map.hasLayer(bubbleGroup)) map.removeLayer(bubbleGroup);
});
document.getElementById('modeBubbles').addEventListener('click', () => {
  document.getElementById('modeBubbles').classList.add('active');
  document.getElementById('modePolygons').classList.remove('active');
  if (map.hasLayer(geoLayer)) map.removeLayer(geoLayer);
  if (!map.hasLayer(bubbleGroup)) map.addLayer(bubbleGroup);
});
</script>
